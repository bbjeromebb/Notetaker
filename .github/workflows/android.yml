name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Tests en APK bouwen
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: APK hernoemen
        run: cp app/build/outputs/apk/debug/app-debug.apk notetaker-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: notetaker-android
          path: android/notetaker-android.apk
