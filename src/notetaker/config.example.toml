# Notetaker-configuratie. Alle sleutels zijn optioneel.
# Windows: %APPDATA%\Notetaker\config.toml

dictionary = ["Leiedal", "Kortrijk", "RUP", "MER", "GECORO"]

[stt]
backend = "faster-whisper"      # of "openai-api"
model = "large-v3-turbo"        # kleiner = sneller op CPU: "small", "medium"
device = "auto"                 # GPU als die bruikbaar is, anders CPU
compute_type = "auto"           # int8_float16 op GPU (past in 2 GB), int8 op CPU
language = "nl"
# api_base = "https://api.groq.com/openai/v1"
# api_model = "whisper-large-v3-turbo"
# api_key_env = "GROQ_API_KEY"

[llm]
# Standaard: Ollama, lokaal en gratis. Installeer via https://ollama.com en voer uit:
#   ollama pull gemma3:12b
backend = "ollama"
# Eén model voor dictee en verslagen: één keer in het geheugen (ongeveer 8 GB).
# gemma3:4b is sneller, maar maakte in tests fouten bij zelfcorrecties en stopwoorden.
# Minder dan 16 GB werkgeheugen: gebruik gemma3:4b voor beide.
cleanup_model = "gemma3:12b"
summary_model = "gemma3:12b"
keep_alive = "24h"              # zo lang blijft het model geladen na het laatste gebruik
num_ctx = 16384                 # contextvenster; hoger = meer geheugen
num_gpu = -1                    # -1 = Ollama beslist; 0 = enkel CPU
# Laptop met kleine GPU (bv. GeForce MX550, 2 GB): zet num_gpu = 0, zodat de
# videokaart vrij blijft voor Whisper. Twee modellen passen niet samen in 2 GB.
summary_chunk_chars = 24000     # langere transcripten worden in delen samengevat

# Alternatief 1: Groq, gratis tier (rate limits, data naar de VS)
# backend = "openai-compatible"
# api_base = "https://api.groq.com/openai/v1"
# api_key_env = "GROQ_API_KEY"
# cleanup_model = "llama-3.1-8b-instant"
# summary_model = "llama-3.3-70b-versatile"
# summary_chunk_chars = 12000

# Alternatief 2: Google Gemini, gratis tier (Google mag invoer gebruiken om producten te verbeteren)
# backend = "openai-compatible"
# api_base = "https://generativelanguage.googleapis.com/v1beta/openai/"
# api_key_env = "GEMINI_API_KEY"
# cleanup_model = "gemini-2.5-flash-lite"
# summary_model = "gemini-2.5-flash"

[dictation]
overlay = true                  # opnamevenster onderaan het scherm
hotkey = "ctrl+cmd"             # vasthouden = praten, dubbeltik = hands-free
command_hotkey = "ctrl+cmd+alt" # selectie herschrijven op stem
handsfree_key = "space"
sounds = true

[meeting]
chunk_seconds = 30
mic_label = "Ik"
others_label = "Anderen"
keep_audio = true
audio_format = "opus"   # .ogg, ongeveer 15 MB per uur; "wav" = ongeveer 115 MB per uur
# output_dir = "C:/Users/naam/Documents/Notetaker"

[obsidian]
# Verslagen rechtstreeks in een Obsidian-vault. Ook te kiezen via het menu in het systeemvak.
# vault = "C:/Users/naam/Documents/MijnVault"
folder = "Vergaderingen"
tags = ["vergadering"]
tasks = true            # actiepunten als "- [ ] taak" (werkt met Obsidian Tasks)
audio_in_vault = false  # true = opname naast de notitie, afspeelbaar via ![[...]]

[inbox]
# Opnames in deze mappen van de vault worden automatisch getranscribeerd en samengevat.
# De eerste map (Notetaker) wordt aangemaakt als ze ontbreekt: kies ze als inboxmap in de
# Android-app en als bijlagenmap in Obsidian. Opnames van de Android-app (met .json)
# verdwijnen na verwerking; andere blijven staan. "*" = de hele vault.
# Enkel opnames van na de eerste start (vault_since).
vault_folders = ["Notetaker", "Opnames"]
# folder = "C:/pad/naar/aparte/Syncthing-map"   # optioneel, buiten de vault

[replacements]
"lei dal" = "Leiedal"

[snippets]
"mijn handtekening" = "Met vriendelijke groeten,\nVoornaam Achternaam"

[styles]
"outlook.exe" = "email"
"olk.exe" = "email"
"thunderbird.exe" = "email"
"teams.exe" = "chat"
"ms-teams.exe" = "chat"
"slack.exe" = "chat"
"whatsapp.exe" = "chat"
"code.exe" = "code"
"winword.exe" = "formal"
